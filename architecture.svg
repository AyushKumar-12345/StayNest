<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1420" viewBox="0 0 1100 1420" role="img" aria-labelledby="title desc">
  <title id="title">StayNest made simple: six steps</title>
  <desc id="desc">A simple vertical map of a StayNest request: browser, Express route, login and validation checks, feature logic, data and external services, and response.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 750; }
      .sub { font-size: 18px; fill: #64748b; }
      .num { font-size: 22px; font-weight: 800; fill: #fff; }
      .head { font-size: 24px; font-weight: 700; }
      .body { font-size: 17px; fill: #475569; }
      .note { font-size: 15px; fill: #64748b; }
      .card { stroke-width: 2; rx: 20; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="1420" fill="#f8fafc"/>
  <text x="70" y="75" class="title">StayNest — the easy map</text>
  <text x="70" y="108" class="sub">Remember the journey of one request, from the user's click to the result.</text>

  <!-- Main request path -->
  <rect x="85" y="145" width="930" height="120" fill="#eff6ff" stroke="#60a5fa" class="card"/>
  <circle cx="135" cy="205" r="27" fill="#2563eb"/><text x="128" y="213" class="num">1</text>
  <text x="185" y="193" class="head">The person uses a page</text>
  <text x="185" y="225" class="body">Browser pages show listings, forms, profile, bookings, and the assistant.</text>
  <path d="M550 270V300" class="arrow"/>

  <rect x="85" y="310" width="930" height="120" fill="#f5f3ff" stroke="#a78bfa" class="card"/>
  <circle cx="135" cy="370" r="27" fill="#7c3aed"/><text x="128" y="378" class="num">2</text>
  <text x="185" y="358" class="head">Express receives the request</text>
  <text x="185" y="390" class="body">A URL and method (GET, POST, etc.) select the matching route in the server.</text>
  <path d="M550 435V465" class="arrow"/>

  <rect x="85" y="475" width="930" height="135" fill="#fff7ed" stroke="#fb923c" class="card"/>
  <circle cx="135" cy="542" r="27" fill="#ea580c"/><text x="128" y="550" class="num">3</text>
  <text x="185" y="523" class="head">Middleware checks the request</text>
  <text x="185" y="555" class="body">Parse form / JSON data • restore login session • check login, ownership, or valid input</text>
  <text x="185" y="582" class="note">If a check fails, the app redirects or returns an error instead of doing the action.</text>
  <path d="M550 615V645" class="arrow"/>

  <rect x="85" y="655" width="930" height="155" fill="#fff1f2" stroke="#fb7185" class="card"/>
  <circle cx="135" cy="732" r="27" fill="#e11d48"/><text x="128" y="740" class="num">4</text>
  <text x="185" y="704" class="head">The feature does its work</text>
  <text x="185" y="738" class="body">Accounts • listings • reviews • favorites • booking/payment • AI • contact</text>
  <text x="185" y="771" class="note">The route/controller coordinates the feature and asks models or providers for help.</text>
  <path d="M550 815V845" class="arrow"/>

  <!-- Data/service destinations -->
  <rect x="85" y="855" width="930" height="72" fill="#ecfdf5" stroke="#34d399" class="card"/>
  <circle cx="135" cy="891" r="27" fill="#059669"/><text x="128" y="899" class="num">5</text>
  <text x="185" y="899" class="head">Use the right storage or service</text>

  <rect x="85" y="950" width="440" height="170" fill="#ecfdf5" stroke="#34d399" class="card"/>
  <text x="115" y="988" class="head">MongoDB</text>
  <text x="115" y="1020" class="body">Users, listings, reviews, favorites,</text>
  <text x="115" y="1047" class="body">orders, and login sessions.</text>
  <text x="115" y="1085" class="note">Mongoose reads and saves app data.</text>

  <rect x="575" y="950" width="440" height="170" fill="#f5f3ff" stroke="#a78bfa" class="card"/>
  <text x="605" y="988" class="head">Connected services</text>
  <text x="605" y="1020" class="body">Cloudinary = image files</text>
  <text x="605" y="1047" class="body">Razorpay = booking payment</text>
  <text x="605" y="1074" class="body">Gemini = chat and draft descriptions</text>

  <path d="M550 1125V1150" class="arrow"/>
  <rect x="85" y="1160" width="930" height="120" fill="#eff6ff" stroke="#60a5fa" class="card"/>
  <circle cx="135" cy="1220" r="27" fill="#2563eb"/><text x="128" y="1228" class="num">6</text>
  <text x="185" y="1208" class="head">Send the result back to the browser</text>
  <text x="185" y="1240" class="body">A page, redirect, message, JSON response, or booking invoice.</text>
  <text x="70" y="1335" class="sub">Easy memory phrase: B → R → M → F → S → R</text>
  <text x="70" y="1370" class="body">Browser → Route → Middleware → Feature → Storage / services → Response</text>
</svg>
