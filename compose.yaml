services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staynest-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - MONGO_URL=mongodb://mongo:27017/staynest
      - ATLASDB_URL=${ATLASDB_URL:-}
      - SECRET=${SECRET:-staynest_local_development_secret_key_change_in_production}
      - CLOUD_NAME=${CLOUD_NAME:-}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_API_SECRET=${CLOUD_API_SECRET:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0-jammy
    container_name: staynest-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    name: staynest_mongo_data

